<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contato | A3 Ads&Lab</title>
  <meta name="robots" content="noindex,nofollow" />

  <!-- Meta Pixel (status 200, sem redirect imediato) -->
  <script>
    // carrega o fbevents com evento de onload para garantir que baixou
    (function loadPixel(){
      if (window.fbq) return;
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];
      t=b.createElement(e);t.async=!0;t.src=v;
      // marcamos quando o script realmente carregou
      t.addEventListener('load', function(){ window.__pixelLoaded = true; });
      s=b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t,s);
      }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
    })();
  </script>
  <script>
    // configurações
    const PIXEL_ID = '2061449251273524';
    const WA_MESSAGE = 'Olá! Tenho interesse na gestão de tráfego da A3 Ads&Lab e queria mais informações sobre planos e valores.';
    const WA_LINK = 'https://wa.me/5585985499095?text=' + encodeURIComponent(WA_MESSAGE);

    // dispara pageview assim que fbq existir
    function trackPageView() {
      try { fbq('init', PIXEL_ID); fbq('track', 'PageView'); } catch(e){}
    }

    // dispara contato + custom
    function trackContact() {
      try {
        fbq('track', 'Contact');
        fbq('trackCustom', 'ClickWhatsApp');
      } catch(e){}
    }

    // lógica de “aguarda e redireciona”
    function startFlow() {
      const a = document.getElementById('wa-link');
      a.href = WA_LINK;

      // garante que o script do pixel realmente chegou
      const start = performance.now();
      const MAX_WAIT_MS = 1200; // ~1.2s de janela para envio do evento

      (function waitForPixel(){
        const ready = typeof fbq === 'function' && window.__pixelLoaded === true;
        const elapsed = performance.now() - start;

        if (ready) {
          trackPageView();
          trackContact();
          setTimeout(() => window.location.replace(WA_LINK), 350); // tempo de flush
        } else if (elapsed < MAX_WAIT_MS) {
          requestAnimationFrame(waitForPixel);
        } else {
          // fallback: sem pixel, segue pro link após 1.2s
          window.location.replace(WA_LINK);
        }
      })();
    }

    // inicia quando o DOM estiver pronto
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      startFlow();
    } else {
      document.addEventListener('DOMContentLoaded', startFlow);
    }
  </script>

  <!-- NoScript: apenas imagem (continua 200, sem redirect automático) -->
  <noscript>
    <img height="1" width="1" style="display:none"
         src="https://www.facebook.com/tr?id=2061449251273524&ev=PageView&noscript=1"/>
  </noscript>

  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial}
    .wrap{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;padding:24px}
    .card{max-width:560px}
    .muted{opacity:.7;font-size:.95rem}
    .btn{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:12px;
         text-decoration:none;border:1px solid #e5e5e5}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Preparando seu contato no WhatsApp…</h1>
      <p class="muted">Aguarde um instante para registrarmos o evento de contato. Se não avançar, toque no botão:</p>
      <a id="wa-link" class="btn" href="#" rel="nofollow">Abrir no WhatsApp</a>
      <p class="muted">Dica: deixe esta aba aberta enquanto o WhatsApp inicia.</p>
    </div>
  </div>

  <!-- clique manual também conta -->
  <script>
    document.getElementById('wa-link').addEventListener('click', function(){
      trackContact();
    });
  </script>
</body>
</html>
